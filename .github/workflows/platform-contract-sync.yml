name: Platform contract synchronization

on:
  workflow_dispatch:
  repository_dispatch:
    types: [platform-contracts-updated]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:openapi
      - run: npm run check:platform-contracts
      - run: npm run check:content
